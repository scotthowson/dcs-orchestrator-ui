<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data: blob:; connect-src 'self' http://127.0.0.1:* http://localhost:* http://*:* https://*:*; frame-src 'self' blob: data:;" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>DCS Orchestrator</title>
    <script>
      // The look before the first paint: the theme this device showed last, in the
      // mode the person chose (or the device prefers) — written by stores/themeStore.
      (function () {
        var html = document.documentElement
        try {
          var boot = JSON.parse(localStorage.getItem('dcs-boot-look') || 'null') || {}
          var pref = boot.pref
          var light = pref === 'light' || (pref !== 'dark' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
          var mode = light ? 'light' : 'dark'
          html.classList.toggle('light', light)
          html.classList.toggle('dark', !light)
          html.style.colorScheme = mode
          if (boot.bg && boot.bg[mode]) html.style.backgroundColor = boot.bg[mode]
          if (boot.css && boot.css[mode]) {
            html.setAttribute('data-theme', boot.name || 'theme')
            var style = document.createElement('style')
            style.id = 'dcs-theme'
            style.textContent = boot.css[mode]
            document.head.appendChild(style)
          }
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta && boot.meta && boot.meta[mode]) meta.setAttribute('content', boot.meta[mode])
        } catch (e) {
          // no stored look: the stock dark look, as before
        }
      })()
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
