name: CI

on:
  push:
    branches: [v2.0.0]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # what a release would stop on, found at the push instead
      - name: Type check
        run: npm run typecheck

      # every built-in look readable (WCAG AA), derived looks stable, the theme JSON contract, the engine's class inventory
      - name: Themes
        run: npm run check:themes

      - name: Build the dashboard
        run: npm run build:renderer

      # the desktop app's remembered passwords (main vault + renderer bridge) and its guard for links it hands to the system
      - name: Unit tests
        run: |
          node tests/credential-vault.mjs
          node tests/external-links.mjs

      # The browser tests need the lab (tests/lab/lab.sh: copies of the AIO API, a fake docker, a mock Proxmox, Vite)
      # and a Chrome, so they run locally before a release, not here (see tests/README.md):
      #   tests/lab/lab.sh start
      #   PUPPETEER_DIR=/tmp/dcs-ui-sweep node tests/server-accounts.mjs    # accounts per server; nothing A issued reaches B
      #   PUPPETEER_DIR=/tmp/dcs-ui-sweep node tests/remember-password.mjs
      #   PUPPETEER_DIR=/tmp/dcs-ui-sweep WIZARD_API=http://127.0.0.1:41923 node tests/ui-sweep.mjs
      #   tests/lab/lab.sh stop
