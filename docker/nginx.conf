server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ──────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # frame-src blob: — plugin cards render inside sandboxed frames built from blob URLs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; connect-src 'self'; font-src 'self' data:; frame-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # HSTS — only effective behind Traefik/TLS but harmless otherwise
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hide nginx version
    server_tokens off;

    # ── Gzip Compression ──────────────────────────────────────────
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # ── SPA Routing ───────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must always be revalidated: it names the hashed bundles, and
        # a cached copy keeps serving an old build after the image is updated.
        expires -1;
    }

    # ── API Reverse Proxy ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://DCS_API_HOST_PLACEHOLDER:DCS_API_PORT_PLACEHOLDER/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a restore of a recovery bundle answers when it is done (minutes with App-Data), an upload is checked before it is answered
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        # SSE streaming support (and a backup archive streams to the browser as it is read)
        proxy_buffering off;
        proxy_cache off;

        # The API limits each route itself (API_MAX_BODY_SIZE, 1 MB; API_MAX_UPLOAD_SIZE, 128 MB, for a backup archive,
        # a recovery bundle and the setup wizard's restore): this only has to let those through. 10m refused every
        # bundle and archive above 10 MB here with nginx's own 413.
        client_max_body_size 200m;
    }

    # ── Favicon ───────────────────────────────────────────────────
    location = /favicon.ico {
        try_files $uri =204;
        access_log off;
        log_not_found off;
    }

    # ── Static Asset Caching ──────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Block dot files (except .well-known) ──────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
