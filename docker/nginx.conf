server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ──────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # frame-src blob: — plugin cards render inside sandboxed frames built from blob URLs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; connect-src 'self' https: wss: http://*:* ws://*:*; font-src 'self' data:; frame-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    # HSTS — only effective behind Traefik/TLS but harmless otherwise
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hide nginx version
    server_tokens off;

    # ── Gzip Compression ──────────────────────────────────────────
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # ── SPA Routing ───────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must always be revalidated: it names the hashed bundles, and
        # a cached copy keeps serving an old build after the image is updated.
        expires -1;
    }

    # ── API uploads: a backup archive or a recovery bundle, up to 20 GB ──
    # The API takes these as the request body, streams them to its disk and enforces its own limit
    # (API_MAX_BACKUP_UPLOAD_SIZE, 20 GB) and the room it has before it reads a byte: nginx passes them on as they
    # arrive (no cap here, no copy in nginx's temp folder), and waits as long as a large one takes. The timeouts are
    # between two reads or writes; the answer comes once the API has checked the file (minutes for 20 GB).
    location ~ ^/api/(backups/upload|recovery/upload|fleet/members/[^/]+/backups/upload)$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://DCS_API_HOST_PLACEHOLDER:DCS_API_PORT_PLACEHOLDER;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # ── The live stream ───────────────────────────────────────────
    # One long request per open dashboard. The session rides in the Authorization header; older dashboards sent it as
    # ?token= in the address, so the stream is never written to the access log either way.
    location = /api/stream {
        access_log off;
        proxy_pass http://DCS_API_HOST_PLACEHOLDER:DCS_API_PORT_PLACEHOLDER/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── API Reverse Proxy ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://DCS_API_HOST_PLACEHOLDER:DCS_API_PORT_PLACEHOLDER/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a restore of a recovery bundle answers when it is done (minutes with App-Data), an upload is checked before it is answered
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        # SSE streaming support (and a backup archive streams to the browser as it is read)
        proxy_buffering off;
        proxy_cache off;

        # The API limits each route itself (API_MAX_BODY_SIZE, 1 MB; API_MAX_UPLOAD_SIZE, 128 MB, for the setup
        # wizard's restore, a bundle sent inside JSON): this only has to let those through. The uploads of archives and
        # bundles have the location above.
        client_max_body_size 200m;
    }

    # ── Favicon ───────────────────────────────────────────────────
    location = /favicon.ico {
        try_files $uri =204;
        access_log off;
        log_not_found off;
    }

    # ── Static Asset Caching ──────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Block dot files (except .well-known) ──────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
